services:

  jenkins:

    build:
      context: .
      dockerfile: Dockerfile

    image: quickcart-jenkins:lts-docker

    container_name: quickcart-jenkins

    group_add:
      - "${DOCKER_GID}"

    ports:
      - "8080:8080"
      - "50000:50000"

    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

    networks:
      - quickcart-network

    restart: unless-stopped

networks:

  quickcart-network:
    external: true

volumes:

  jenkins-data:
