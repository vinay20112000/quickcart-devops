services:

  jenkins:
    image: quickcart-jenkins:lts-docker
    container_name: quickcart-jenkins

    ports:
      - "8080:8080"
      - "50000:50000"
    group_add:
      - "993"

    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

    restart: unless-stopped


volumes:

  jenkins-data:
