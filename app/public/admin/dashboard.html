<!DOCTYPE html>
<html>
<head>
  <title>QuickCart Admin Dashboard</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<header>
  <div class="logo">
    Quick<span>Cart</span> Admin
  </div>

  <nav>
    <a href="/">Store</a>
    <a href="/admin/login">Logout</a>
  </nav>
</header>

<div class="container">

  <h1>Admin Dashboard</h1>

  <div class="dashboard-grid">

    <div class="metric">
      <p>Total Users</p>
      <h2>128</h2>
    </div>

    <div class="metric">
      <p>Total Orders</p>
      <h2>392</h2>
    </div>

    <div class="metric">
      <p>Revenue</p>
      <h2>₹2.8L</h2>
    </div>

    <div class="metric">
      <p>Products</p>
      <h2>24</h2>
    </div>

  </div>

  <h2>Recent Orders</h2>

  <table>

    <thead>
      <tr>
        <th>Order</th>
        <th>Customer</th>
        <th>Amount</th>
        <th>Status</th>
      </tr>
    </thead>

    <tbody>

      <tr>
        <td>#10021</td>
        <td>Rahul</td>
        <td>₹1,299</td>
        <td>PLACED</td>
      </tr>

      <tr>
        <td>#10022</td>
        <td>Anjali</td>
        <td>₹2,598</td>
        <td>SHIPPED</td>
      </tr>

    </tbody>

  </table>

</div>

</body>
</html>
