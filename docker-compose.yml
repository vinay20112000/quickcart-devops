services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - quickcart-app
    networks:
      - quickcart-network
    restart: unless-stopped

  quickcart-app:
    image: quickcart:v2
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    environment:
      PORT: 3000
      DB_HOST: quickcart-mysql
      DB_PORT: 3306
      DB_NAME: quickcart
      DB_USER: quickcart
      DB_PASSWORD: QuickCartDev@2026!
      DB_CONNECTION_LIMIT: 10

    depends_on:
      quickcart-mysql:
        condition: service_healthy

    networks:
      - quickcart-network

    restart: unless-stopped


  quickcart-mysql:
    image: mysql:8.0

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-prootpassword"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: quickcart
      MYSQL_USER: quickcart
      MYSQL_PASSWORD: QuickCartDev@2026!

    volumes:
      - quickcart-db-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

    networks:
      - quickcart-network

    restart: unless-stopped

networks:
  quickcart-network:
    driver: bridge

volumes:
  quickcart-db-data:
